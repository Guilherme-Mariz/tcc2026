<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            opacity: 0;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="../css/tekoia.css">
    <script src="../js/session-switch.js" defer></script>
    <title>teko. — TEKO.IA</title>
</head>

<body>

    <!-- ── MODAL LOGOUT ── -->
    <div id="logout-overlay" class="logout-overlay" aria-hidden="true">
        <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title">
            <div class="logout-icon" aria-hidden="true">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h2 class="logout-title" id="logout-title">Sair da conta?</h2>
            <p class="logout-desc">Você tem certeza que quer sair? Precisará entrar novamente da próxima vez.</p>
            <div class="logout-actions">
                <button class="logout-btn-cancel" onclick="fecharLogout()">Cancelar</button>
                <button class="logout-btn-confirm" onclick="confirmarLogout()">Sim, sair</button>
            </div>
        </div>
    </div>

    <div id="session-switch-overlay" class="session-switch-overlay" aria-hidden="true">
        <div class="session-switch-modal" role="dialog" aria-modal="true" aria-labelledby="session-switch-title">
            <button type="button" class="session-switch-close" id="session-switch-close" aria-label="Fechar">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="session-switch-icon" aria-hidden="true"
            >
                <i class="fa-solid fa-repeat"></i>
            </div>

            <h2 id="session-switch-title">
                Trocar sessão
            </h2>

            <p class="session-switch-description">
                Escolha a criança que usará a plataforma.
            </p>

            <div class="home-session-options" id="home-session-options"></div>

            <div class="session-password-field">
                <label for="session-password">
                    PIN do responsável
                </label>

                <div class="session-password-wrap">
                        <i class="fa-solid fa-key" aria-hidden="true"></i>

                    <input type="password" id="session-password" placeholder="Digite o PIN de 4 números" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" aria-label="PIN de 4 números">

                    <button type="button" id="session-password-toggle" aria-label="Mostrar PIN">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <span class="session-switch-error" id="session-switch-error" aria-live="polite"></span>
            </div>

            <div class="session-switch-actions">
                <button type="button" class="session-switch-cancel" id="session-switch-cancel">
                    Cancelar
                </button>

                <button type="button" class="session-switch-confirm" id="session-switch-confirm">
                    Confirmar troca
                </button>
            </div>
        </div>
    </div>

    <!-- ── SIDEBAR ── -->
    <aside id="sidebar" role="navigation" aria-label="Menu principal">
        <a href="/" class="sidebar-logo" aria-label="teko. início">
            <span class="logo-teko">teko</span><span class="logo-dot">.</span>
        </a>

        <nav class="sidebar-nav">
            <a href="/home" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-house"></i></span>
                <span class="snav-label">Início</span>
            </a>
            <a href="/atividades" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-shapes"></i></span>
                <span class="snav-label">Atividades</span>
            </a>
            <a href="/tekoia" class="snav-item active" aria-current="page" data-nav>
                <span class="snav-icon snav-icon-ia">
                    <img src="../img/mascot/teko-icn.png" alt="" aria-hidden="true">
                </span>
                <span class="snav-label">TEKO.IA</span>
            </a>
            <a href="/responsavel" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-people-roof"></i></span>
                <span class="snav-label">Responsável</span>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <button type="button" class="snav-item session-switch-button" id="session-switch-button">
                <span class="snav-icon">
                    <i class="fa-solid fa-repeat"></i>
                </span>
        
                <span class="snav-label">
                    Trocar sessão
                </span>
            </button>
        
            <span class="sidebar-divider" aria-hidden="true"></span>
        
            <a href="/configuracoes" class="snav-item snav-config" data-nav>
                <span class="snav-icon">
                    <i class="fa-solid fa-gear"></i>
                </span>
        
                <span class="snav-label">
                    Config.
                </span>
            </a>
        
            <button class="sidebar-logout-btn" onclick="abrirLogout()" title="Sair da conta" aria-label="Sair da conta">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </aside>

    <!-- ── MOBILE HEADER ── -->
    <header id="mobile-header">
        <a href="/" class="sidebar-logo">
            <span class="logo-teko">teko</span><span class="logo-dot">.</span>
        </a>
        <div class="mobile-header-right">
            <button class="mobile-logout-btn" onclick="abrirLogout()" aria-label="Sair da conta">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
            <button id="mobile_btn" aria-label="Abrir menu">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- ── MOBILE DRAWER ── -->
    <div id="mobile_overlay"></div>
    <div id="mobile_drawer">
        <button id="mobile_close" aria-label="Fechar menu"><i class="fa-solid fa-xmark"></i></button>
        <nav class="drawer-nav">
            <a href="/home" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-house"></i></span>
                <span class="snav-label">Início</span>
            </a>
            <a href="/atividades" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-shapes"></i></span>
                <span class="snav-label">Atividades</span>
            </a>
            <a href="/tekoia" class="snav-item" data-nav>
                <span class="snav-icon snav-icon-ia">
                    <img src="../img/mascot/teko-icn.png" alt="" aria-hidden="true">
                </span>
                <span class="snav-label">TEKO.IA</span>
            </a>
            <a href="/responsavel" class="snav-item" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-people-roof"></i></span>
                <span class="snav-label">Responsável</span>
            </a>
            <button type="button" class="snav-item drawer-session-switch" id="drawer-session-switch">
                <span class="snav-icon">
                    <i class="fa-solid fa-repeat"></i>
                </span>

                <span class="snav-label">
                    Trocar sessão
                </span>
            </button>
            <a href="/configuracoes" class="snav-item active" data-nav>
                <span class="snav-icon"><i class="fa-solid fa-gear"></i></span>
                <span class="snav-label">Config.</span>
            </a>
        </nav>
    </div>

    <!-- ── MAIN ── -->
    <main class="tekoia-main">
        <div class="tekoia-layout">
            <div class="tekoia-right">
                <div class="chat-card">
                    <div class="chat-mascot">
                        <img src="../img/mascot/teko-comprimento.png" alt="Teko">
                    </div>

                    <div class="chat-display">
                        <div class="chat-session-wrap">
                            <button class="chat-session-btn" id="btn-sessao" aria-haspopup="listbox"
                                aria-expanded="false">
                                <i class="fa-solid fa-users"></i>
                                <span>Sessão</span>
                                <i class="fa-solid fa-chevron-down chat-session-arrow"></i>
                            </button>
                            <ul class="chat-session-list" id="chat-session-list" role="listbox" hidden>
                                <!-- TODO backend: popular dinamicamente -->
                                <li class="chat-session-empty">Nenhuma criança cadastrada</li>
                            </ul>
                        </div>
                        <p class="chat-display-text" id="chat-display-text"></p>
                    </div>
                    <div class="chat-input-area">
                        <button class="mic-btn" id="mic-btn" type="button" title="Falar mensagem" aria-pressed="false">
                            <i class="fa-solid fa-microphone"></i>
                        </button>

                        <input type="text" class="chat-input" id="chat-input" placeholder="Escreva uma mensagem..."
                            autocomplete="off" aria-label="Mensagem">

                        <button class="send-btn" id="send-btn" aria-label="Enviar">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /* ── sessão ── */
        function carregarAvatar() {
            try {
                const s = JSON.parse(localStorage.getItem('teko_session') || '{}');
                const nome = s?.crianca?.nome || s?.responsavel?.nome_completo || s?.user?.email?.split('@')[0] || 'T';
                document.querySelectorAll('#user-avatar, #user-avatar-mobile').forEach(el => {
                    if (el) el.textContent = nome.charAt(0).toUpperCase();
                });
            } catch (e) { }
        }

        /* ── mobile drawer ── */
        const overlay = document.getElementById('mobile_overlay');
        const drawer = document.getElementById('mobile_drawer');
        document.getElementById('mobile_btn').addEventListener('click', () => {
            drawer.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden';
        });
        document.getElementById('mobile_close').addEventListener('click', fecharDrawer);
        overlay.addEventListener('click', fecharDrawer);
        function fecharDrawer() {
            drawer.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = '';
        }
        drawer.querySelectorAll('a').forEach(a => a.addEventListener('click', fecharDrawer));

        /* ── transição entre páginas ── */
        document.querySelectorAll('[data-nav]').forEach(link => {
            link.addEventListener('click', e => {
                const href = link.getAttribute('href');
                if (!href || href === '#') return;
                e.preventDefault();
                document.body.classList.add('page-leaving');
                setTimeout(() => { window.location.href = href; }, 180);
            });
        });

        /* ── logout ── */
        function abrirLogout() {
            const modal = document.getElementById('logout-overlay');
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }
        function fecharLogout() {
            const modal = document.getElementById('logout-overlay');
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }
        function confirmarLogout() {
            localStorage.removeItem('teko_session');
            localStorage.removeItem('teko_streak');
            document.body.classList.add('page-leaving');
            setTimeout(() => { window.location.href = '/pages/login.html'; }, 180);
        }
        document.getElementById('logout-overlay').addEventListener('click', e => {
            if (e.target === e.currentTarget) fecharLogout();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') fecharLogout();
        });

        /* ── chat ── */

        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        let childIdSelecionado = null;
        let typingTimer = null;

        function horaAtual() {
            return new Date().toLocaleTimeString('pt-BR', {
                hour: '2-digit',
                minute: '2-digit'
            });
        }


        /* ── carregar crianças ── */

        async function carregarCriancas() {

            try {

                const resposta = await fetch(
                    'http://localhost:3000/children',
                    {
                        method: 'GET',
                        credentials: 'include'
                    }
                );

                const dados = await resposta.json();

                if (!resposta.ok || !dados.success) {
                    throw new Error('Não foi possível carregar as crianças.');
                }

                listaSessao.innerHTML = '';

                if (!dados.children || dados.children.length === 0) {

                    listaSessao.innerHTML = `
                <li class="chat-session-empty">
                    Nenhuma criança cadastrada
                </li>
            `;

                    return;
                }

                dados.children.forEach(child => {

                    const item = document.createElement('li');

                    item.textContent = child.firstName;
                    item.dataset.childId = child.id;
                    item.setAttribute('role', 'option');
                    item.tabIndex = 0;

                    item.addEventListener('click', () => {
                        selecionarCrianca(child);
                    });

                    listaSessao.appendChild(item);
                });

            } catch (error) {

                console.error(
                    'Erro ao carregar crianças:',
                    error
                );

                listaSessao.innerHTML = `
            <li class="chat-session-empty">
                Erro ao carregar crianças
            </li>
        `;
            }
        }


        /* ── selecionar criança ── */

        function selecionarCrianca(child) {

            childIdSelecionado = child.id;

            const textoSessao =
                document.querySelector('#btn-sessao span');

            if (textoSessao) {
                textoSessao.textContent = child.firstName;
            }

            listaSessao.hidden = true;

            btnSessao.setAttribute(
                'aria-expanded',
                'false'
            );

            console.log(
                'Criança selecionada:',
                child
            );

            digitarMensagem(
                `Oi, ${child.firstName}! 👋 Como você está se sentindo hoje? 😊`
            );
        }


        /* ── menu de sessão ── */

        const btnSessao =
            document.getElementById('btn-sessao');

        const listaSessao =
            document.getElementById('chat-session-list');

        btnSessao.addEventListener('click', (e) => {

            e.stopPropagation();

            const aberto = !listaSessao.hidden;

            listaSessao.hidden = aberto;

            btnSessao.setAttribute(
                'aria-expanded',
                String(!aberto)
            );
        });

        document.addEventListener('click', () => {

            listaSessao.hidden = true;

            btnSessao.setAttribute(
                'aria-expanded',
                'false'
            );
        });


        /* ── área da resposta ── */

        const chatDisplay =
            document.getElementById('chat-display-text');


        function digitarMensagem(texto) {

            clearTimeout(typingTimer);

            chatDisplay.classList.remove('is-loading');

            chatDisplay.textContent = '';

            let i = 0;

            (function passo() {

                if (i < texto.length) {

                    chatDisplay.textContent +=
                        texto.charAt(i);

                    i++;

                    typingTimer =
                        setTimeout(passo, 22);
                }

            })();
        }


        function mostrarCarregando() {

            clearTimeout(typingTimer);

            chatDisplay.innerHTML = `
        <span class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </span>
    `;
        }


        /* ── microfone ── */

        const micBtn =
            document.getElementById('mic-btn');

        let gravando = false;

        micBtn.addEventListener('click', () => {

            gravando = !gravando;

            micBtn.classList.toggle(
                'recording',
                gravando
            );

            micBtn.setAttribute(
                'aria-pressed',
                String(gravando)
            );

            // Futuramente:
            // SpeechRecognition
        });


        /* ── enviar mensagem ── */

        async function enviarMensagem() {

            const texto =
                chatInput.value.trim();

            if (!texto) return;


            if (!childIdSelecionado) {

                digitarMensagem(
                    'Primeiro escolha uma criança na opção "Sessão". 😊'
                );

                return;
            }


            chatInput.value = '';

            sendBtn.disabled = true;

            mostrarCarregando();


            try {

                const resposta = await fetch(
                    'http://localhost:3000/api/ai/chat',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        credentials: 'include',

                        body: JSON.stringify({
                            childId: childIdSelecionado,
                            message: texto
                        })
                    }
                );


                const dados = await resposta.json();


                if (!resposta.ok) {

                    if (resposta.status === 403) {

                        digitarMensagem(
                            'Você não tem acesso a essa criança.'
                        );

                        return;
                    }

                    if (resposta.status === 401) {

                        digitarMensagem(
                            'Sua sessão expirou. Faça login novamente.'
                        );

                        return;
                    }

                    throw new Error(
                        dados.error ||
                        'Erro ao conversar com o TEKO.'
                    );
                }


                digitarMensagem(
                    dados.response ||
                    'Hmm, não entendi. Pode repetir? 😊'
                );


            } catch (error) {

                console.error(
                    'Erro ao enviar mensagem:',
                    error
                );

                digitarMensagem(
                    'Ops, tive um problema aqui. Tenta de novo! 😅'
                );

            } finally {

                sendBtn.disabled = false;

                chatInput.focus();
            }
        }


        sendBtn.addEventListener(
            'click',
            enviarMensagem
        );


        chatInput.addEventListener(
            'keydown',
            e => {

                if (
                    e.key === 'Enter' &&
                    !e.shiftKey
                ) {

                    e.preventDefault();

                    enviarMensagem();
                }
            }
        );

        /* ── init ── */
        carregarAvatar();
        carregarCriancas();
        digitarMensagem('Oi! 👋 Eu sou o Teko, seu amigo virtual! Como você está se sentindo hoje? 😊');
    </script>

</body>

</html>
