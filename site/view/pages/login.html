<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/img/teko%20logo/logo-transparente.webp">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teko — Entrar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/style-login.css">
</head>
<body class="cadastro-page">

  <header class="cad-header">
    <a onclick="irParaIndex()" class="cad-logo">
      <span class="logo-teko">teko</span><span class="logo-dot">.</span>
    </a>
    <a onclick="irParaIndex()" class="cad-voltar">
      <i class="fa-solid fa-arrow-left"></i>
      Voltar ao início
    </a>
  </header>

  <main class="cad-main">
    <div class="cad-card">

      <!-- Lado esquerdo: Login -->
      <div class="cad-lado cad-login">
        <h2 class="cad-titulo">Olá! Bem-vindo<br>ao <em>teko</em>.</h2>

        <div id="login-alert" class="login-alert" role="alert" aria-live="polite" aria-hidden="true">
          <i
            id="login-alert-icon"
            class="fa-solid fa-circle-exclamation"
          ></i>
          <span id="login-alert-text"></span>
        </div>

        <form class="login-form" method="POST" action="/" id="form-login" novalidate>
          <div class="input-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-envelope"></i>
              <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" />
            </div>
          </div>

          <div class="input-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="toggle-senha" aria-label="Mostrar senha" onclick="toggleSenha()">
                <i class="fa-solid fa-eye" id="icone-olho"></i>
              </button>
            </div>
          </div>

          <button type="button" id="abrir-recuperacao" class="esqueci-senha">Esqueci minha senha</button>

          <button type="submit" class="btn-entrar">
            <i class="fa-solid fa-right-to-bracket"></i>
            Entrar
          </button>

          <div class="login-separator">
            <span>ou</span>
          </div>

          <button type="button" class="btn-google" id="btn-google">
            <i class="fa-brands fa-google"></i>
            Continuar com o Google
          </button>
        </form>
      </div>

      <!-- Divisor vertical -->
      <div class="cad-divisor"></div>

      <!-- Lado direito: Mascote + Cadastro -->
      <div class="cad-lado cad-direita">
        <div class="cad-mascote">
          <img src="../img/mascot/teko-comprimento.webp" alt="Mascote Teko" />
        </div>

        <a onclick="irParaRegister()" class="cad-register-box">
          <span>Ainda não possui conta?</span>
          <strong>Cadastre-se! <i class="fa-solid fa-arrow-right"></i></strong>
        </a>
      </div>

    </div>
  </main>

  <footer>
    <a href="/" class="footer-logo">
      <span class="logo-teko">teko</span><span class="logo-dot">.</span>
    </a>
    <p class="footer-copy">
      © 2025 <span>Teko</span> — Educação Socioemocional. Todos os direitos reservados.
    </p>
    <div class="footer-social">
      <a href="https://www.instagram.com/tcctekotea" target="_blank" aria-label="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://www.youtube.com/" target="_blank" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
    </div>
  </footer>

  <div id="loading-screen">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p class="loading-text">Carregando<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></p>
    </div>
  </div>
<dialog id="recuperacao" aria-labelledby="rec-titulo">
  <h2 id="rec-titulo">Recuperar senha</h2>
  <form id="rec-form" class="login-form">
    <label>E-mail da conta<input id="rec-email" type="email" autocomplete="email" maxlength="254" required></label>
    <fieldset id="rec-dados" hidden disabled>
      <label>Código recebido por e-mail<input id="rec-codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required></label>
      <label>Nova senha (mínimo de 8 caracteres)<input id="rec-senha" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirme a nova senha<input id="rec-confirmacao" type="password" autocomplete="new-password" required></label>
    </fieldset>
    <p id="rec-status" role="status"></p>
    <button class="btn-entrar" id="rec-enviar">Enviar código</button>
    <button type="button" id="rec-reiniciar" hidden>Solicitar outro código</button>
    <button type="button" id="rec-fechar">Voltar ao login</button>
  </form>
</dialog>
<script src="/js/recuperacao.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
